<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div class="shell">
    <header class="brand">
      <div class="brand-mark">
        <img src="icons/icon48.png" alt="" width="34" height="34" />
      </div>
      <div class="brand-text">
        <h1>Easy English</h1>
        <p class="sub">Rewrite into simpler English</p>
      </div>
    </header>

    <section id="status" class="status status--checking">
      <span class="dot"></span>
      <span id="status-text">Checking built-in AI…</span>
    </section>

    <section class="hint">
      <p><b>Select text</b> on any page to get a "Simplify" button, or right-click a selection and choose <b>Rewrite in simpler English</b>.</p>
    </section>

    <section class="settings">
      <div class="field">
        <label for="level">Difficulty</label>
        <div class="select-wrap">
          <select id="level">
            <option value="a2">Beginner (A2)</option>
            <option value="b1">Simple (B1)</option>
            <option value="b2">Plain (B2)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="native-lang">Translate to</label>
        <div class="select-wrap">
          <select id="native-lang">
            <option value="">Off</option>
            <option value="ja">日本語 (Japanese)</option>
            <option value="zh-Hans">中文 (Chinese, Simplified)</option>
            <option value="ko">한국어 (Korean)</option>
            <option value="es">Español (Spanish)</option>
            <option value="fr">Français (French)</option>
            <option value="de">Deutsch (German)</option>
            <option value="pt">Português (Portuguese)</option>
            <option value="ru">Русский (Russian)</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="ar">العربية (Arabic)</option>
            <option value="vi">Tiếng Việt (Vietnamese)</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
        </div>
      </div>
    </section>

    <footer>
      <p class="note" id="setup-note" hidden></p>
      <p class="credit">Powered by Chrome built-in AI · Gemini Nano</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
